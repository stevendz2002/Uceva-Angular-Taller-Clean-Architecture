@switch (state) {
	@case ('loading') {
		<app-alert alertState="loading" text="Cargando Proveedores..."></app-alert>
	}

	@case ('error') {
		<app-alert alertState="error" text="Error al Cargar los Proveedores"></app-alert>
	}

	@case ('success') {
		<app-providers-table [providers]="providers"></app-providers-table>
	}
}
